baseURL: "https://elidrissi-abdelmajid.github.io/blog.abdelm.id/"

languageCode: "en-us"
title: "Abdelmajid El Idrissi"

theme: hextra

enableRobotsTXT: true

enableGitInfo: true

params:
  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  page:
    width: wide
    displayPagination: true

  blog:
    list:
      displayTags: true
      sortBy: weight
      sortOrder: asc

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1

    - name: Blog
      pageRef: /posts
      weight: 2

    - name: Projects
      pageRef: /projects
      weight: 3

    - name: About
      pageRef: /about
      weight: 4

    - name: Search
      weight: 5
      params:
        type: search

    - name: GitHub
      url: "https://github.com/elidrissi-abdelmajid"
      weight: 6
      params:
        icon: github

  sidebar:
    - name: About
      pageRef: /about
      weight: 1

    - name: GitHub
      url: "https://github.com/elidrissi-abdelmajid"
      weight: 2